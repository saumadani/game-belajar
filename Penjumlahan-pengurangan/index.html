<!DOCTYPE html>

    <main class="game-grid">

      <a href="game02/index.html" class="game-card card-2">

        <span class="game-title">Pasangan Angka Rahasia</span>
      </a>

      <a href="game08/index.html" class="game-card card-8">
        <span class="badge">⑧</span>

    <!-- Footer Action -->
    <footer class="footer">
      <button type="button" class="btn-exit" onclick="keluarAplikasi()">❌ Keluar</button>

  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
